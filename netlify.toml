# ================================================================
# Netlify Configuration - PROCASEF Boundou Portal
# https://portailprocasefboundou.netlify.app
# ================================================================

[build]
  publish = "."
  command = ""

[build.processing]
  skip_processing = false
[build.processing.css]
  bundle = false
  minify = true
[build.processing.js]
  bundle = false
  minify = true
[build.processing.html]
  pretty_urls = false

# ----------------------------------------------------------------
# Security & CSP headers for ALL pages
# ----------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://unpkg.com https://cdn.sheetjs.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com https://unpkg.com https://cdn.jsdelivr.net; img-src 'self' data: blob: https:; font-src 'self' https://fonts.gstatic.com https://fonts.googleapis.com https://cdn.jsdelivr.net data:; connect-src 'self' https://docs.google.com https://sheets.googleapis.com https://*.google.com https://*.googleusercontent.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://unpkg.com https://fonts.googleapis.com https://fonts.gstatic.com; frame-src https://boundoudash.netlify.app https://suivioperation.netlify.app https://sifboundou.netlify.app; frame-ancestors 'self'; base-uri 'self'; form-action 'self'"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# ----------------------------------------------------------------
# Cache headers by file type
# ----------------------------------------------------------------

# HTML: no-cache so updates deploy instantly
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, no-cache, must-revalidate"

# Service Worker: NEVER cache
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# JS files: short cache (5 min) so updates propagate fast
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

# CSS: short cache
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

# Images: long cache (7 days)
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=604800, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800, immutable"

# Data files: moderate cache (1 hour) + CORS
[[headers]]
  for = "/data/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=3600, must-revalidate"

# Fonts: long cache (1 year)
[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

# ----------------------------------------------------------------
# Redirects for legacy / bookmarked links
# ----------------------------------------------------------------
[[redirects]]
  from = "/dashboard"
  to = "/"
  status = 302

[[redirects]]
  from = "/stats"
  to = "/"
  status = 302

# ----------------------------------------------------------------
# Local dev server
# ----------------------------------------------------------------
[dev]
  command = "python3 -m http.server 8000"
  port = 8000
  publish = "."
